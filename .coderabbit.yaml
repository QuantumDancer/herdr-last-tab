# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
#
# Tuned from three review rounds on PR #1 (18 findings). The path_instructions
# below exist to prevent specific classes of finding that cost a whole round
# each: round 2 was mostly regressions introduced by round 1's own fixes, and
# round 3 was entirely spec-versus-constitution gaps that nothing had pointed
# CodeRabbit at. Telling it where the authority lives, and to re-check
# cross-references after a change, is what should collapse those rounds.

language: en-US

chat:
  auto_reply: true

knowledge_base:
  learnings:
    # Solo repository with one tech stack -- nothing to gain from cross-repo
    # learnings, and local keeps herdr-specific conventions from leaking out.
    scope: local

reviews:
  profile: chill
  # Findings are advisory input to a human decision, per the constitution's
  # governance section. A blocking CHANGES_REQUESTED adds nothing when the same
  # person triages and merges.
  request_changes_workflow: false
  high_level_summary: true
  changed_files_summary: true
  review_status: true
  collapse_walkthrough: true
  sequence_diagrams: false
  poem: false

  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - main
    ignore_title_keywords:
      - WIP

  pre_merge_checks:
    description:
      mode: warning
    docstrings:
      # Nothing here has functions yet, and the check reports "skipped" every
      # run. Revisit once Rust sources land. Quoted because bare `off` is a YAML
      # boolean, and this field wants the string.
      mode: "off"

  path_filters:
    # Upstream spec-kit scaffolding, vendored rather than authored here.
    - "!.specify/templates/**"
    - "!.specify/scripts/**"
    - "!.claude/skills/speckit-*/**"
    # Scratch space; gitignored, but belt and braces.
    - "!tmp/**"

  path_instructions:
    - path: ".specify/memory/constitution.md"
      instructions: |
        This file is the project's binding authority. Where any other file
        conflicts with it, the other file is wrong.

        Review it for internal consistency and for whether the version bump
        matches the change: MAJOR removes or redefines a principle, MINOR adds
        one or materially expands guidance, PATCH clarifies wording. Check that
        the Sync Impact Report at the top actually describes the diff.

        Do not propose new principles. This plugin is deliberately small; the
        burden of proof sits with any addition.

    - path: "specs/**/spec.md"
      instructions: |
        These are spec-kit feature specifications: user stories with acceptance
        scenarios, functional requirements (FR-nnn), and measurable success
        criteria (SC-nnn). Review them as contracts a test author must be able
        to work from without inventing anything.

        Weight these highest, in order:

        1. **Contradictions against `.specify/memory/constitution.md`.** The
           spec must not promise behavior the constitution forbids, and must not
           omit a contract the constitution fixes -- process exit codes, state
           directory confinement, `min_herdr_version`, documented install / link
           / uninstall commands, action-ID stability. Read both files together.
        2. **Cross-reference drift after an edit.** When one requirement is
           tightened, check every other place that quotes or depends on it:
           other FRs, the SCs that measure it, the acceptance scenarios, the
           Assumptions, and Prior Art. Most defects here are a rule fixed in one
           place and left stale in three others.
        3. **Requirements with no acceptance criterion**, and success criteria
           that no test could fail -- unquantified adjectives, undefined
           workloads, invariants asserted at times the system cannot observe.

        Two things are deliberately in scope and should not be flagged as
        implementation detail: external contracts (herdr event names, the public
        action identifier, storage locations herdr designates, release target
        matrix, minimum herdr version) and the herdr domain vocabulary. What is
        out of scope is any *chosen* implementation: language, framework,
        library, file format, storage mechanism, internal structure.

        Do not ask for implementation artifacts in a specification-only change.
        A missing `herdr-plugin.toml`, `Cargo.toml`, or source file is not a
        defect in a spec PR -- those are produced by the later `/speckit-plan`
        and `/speckit-implement` steps. If a manifest field matters, ask for the
        requirement that will force it, not the file.

    - path: "specs/**/checklists/*.md"
      instructions: |
        Generated from a spec-kit template. The checkbox wording is upstream
        text -- do not propose rewording it; propose a note recording how an
        item is read, or challenge whether the box is honestly checked.

        A checked box is a claim about the spec. Verify it against the spec
        rather than against the checklist's own prose, and say which requirement
        or criterion makes it true.

    - path: "**/*.md"
      instructions: |
        "herdr" is the upstream tool this plugin targets. It is intentionally
        lowercase everywhere, including at the start of a sentence. It is not a
        misspelling; do not report it.

        "Herdr Last Tab" is this project's own name and is title-cased, the way
        `.specify/memory/constitution.md` writes it. The lowercase rule covers
        the tool, not the project name built on top of it.

        Prose wraps at 100 columns by convention. That is a rule about Markdown
        body text, and only that. YAML frontmatter scalars are metadata read by
        a loader; table rows and fenced code carry their own line structure.
        None of them are reflowed to satisfy a prose rule, and an over-long line
        in one of them is not a finding.

        Comments explain *why* -- the business reason or trade-off -- rather than
        restating what the text says.
