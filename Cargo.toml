[package]
name = "herdr-last-tab"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "herdr-last-tab"
path = "src/main.rs"

[lib]
name = "herdr_last_tab"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
fs2 = "0.4"

[dev-dependencies]
toml = "0.8"
