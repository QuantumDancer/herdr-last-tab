name: Release

# Draft first, publish last. A GitHub release is immutable once published, so a release that goes
# out with one target missing is a permanent 404 for those users; a draft that never publishes is
# just a draft sitting there for inspection. Every job below exists to keep that ordering true.
on:
  push:
    tags:
      - "v*"

# No job gets a token it does not need. Each job re-grants exactly what it uses.
permissions: {}

# Two runs against the same tag would race to upload the same asset names. Never cancel in
# progress: a half-uploaded draft is worse than a queued run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The whole workflow hangs off this job's `needs` chain, so nothing is built, uploaded, or
  # published until every precondition here holds.
  guard:
    name: Guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.targets.outputs.matrix }}
      assets: ${{ steps.targets.outputs.assets }}
    steps:
      # Every checkout in this workflow takes `ref: ${{ github.sha }}` rather than the tag. A tag
      # is a mutable pointer: checking out the tag name would let a force-push between the guard
      # and a later job move what gets built out from under the check. `github.sha` is fixed for
      # the life of the run. `persist-credentials: false` keeps the checkout token out of
      # .git/config, where any later step — or anything a build script pulls in — could read it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      # contracts/plugin-manifest.md, "The version-to-tag rule": the tag is `v` plus the manifest
      # version, exactly. A mismatch is not a build failure — it is a 404 at install time on a
      # release that already looks published, because herdr/install.sh builds its download URL
      # from the manifest. So it fails here, before anything exists to install.
      - name: Tag matches the manifest version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Anchored and counted, for the same reason install.sh anchors and counts: an
          # unanchored search for "version" also matches min_herdr_version.
          matches="$(grep -Ec '^version[[:space:]]*=[[:space:]]*"[^"]+"' herdr-plugin.toml || true)"
          if [ "$matches" -ne 1 ]; then
            echo "expected exactly one top-level version in herdr-plugin.toml, found $matches" >&2
            exit 1
          fi
          version="$(sed -nE 's/^version[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' herdr-plugin.toml)"
          if [[ ! $version =~ ^[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "manifest version '$version' is not a semantic version" >&2
            exit 1
          fi
          if [ "$TAG" != "v$version" ]; then
            echo "tag '$TAG' does not match manifest version '$version' (expected 'v$version')" >&2
            exit 1
          fi
          echo "tag $TAG matches manifest version $version"

      # A tag can be created from any commit, including one that was never reviewed or merged.
      # Requiring the tagged commit to be an ancestor of the default branch means a release can
      # only ever contain code that went through the branch everything else is reviewed on.
      # Unauthenticated fetch is fine here because the repository is public; on a private
      # repository this step would need a token with contents: read.
      - name: Tagged commit is on the default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          git fetch --no-tags --quiet origin "+refs/heads/${DEFAULT_BRANCH}:refs/remotes/origin/${DEFAULT_BRANCH}"
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "refs/remotes/origin/${DEFAULT_BRANCH}"; then
            echo "tagged commit $GITHUB_SHA is not an ancestor of ${DEFAULT_BRANCH}" >&2
            exit 1
          fi
          echo "$GITHUB_SHA is on ${DEFAULT_BRANCH}"

      # Re-running against a tag whose release is already published would mean uploading assets
      # into a release users are already installing from. A leftover *draft* from a failed run is
      # not fatal here, but the draft job will not reuse it — see docs/RELEASING.md.
      - name: Tag has no published release yet
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq '.isDraft' >state.txt 2>/dev/null; then
            if [ "$(cat state.txt)" != "true" ]; then
              echo "release $TAG is already published; releases are immutable, so cut a new version" >&2
              exit 1
            fi
            echo "a draft release for $TAG already exists; delete it before re-running (gh release delete $TAG)"
          else
            echo "no release exists for $TAG yet"
          fi

      # The single place the release's target set and asset names are written down. The build
      # matrix and the publish job's completeness check are both derived from this one list, so
      # they cannot drift apart into a release that publishes with an asset nobody checked for.
      # FR-020: this list is exactly what the release declares, and every entry is built *and*
      # exercised on its own native runner before publication.
      - name: Enumerate targets and assets
        id: targets
        run: |
          set -euo pipefail
          # The Intel macOS leg runs on macos-15-intel rather than the macos-13 the plan named:
          # GitHub retired the macOS 13 image, and a job requesting a label with no image behind
          # it never starts. macos-15-intel is the current free x64 macOS runner, and it is still
          # a native host for x86_64-apple-darwin, which is what FR-020 asks of it.
          cat >targets.txt <<'EOF'
          x86_64-unknown-linux-musl ubuntu-latest
          aarch64-unknown-linux-musl ubuntu-24.04-arm
          x86_64-apple-darwin macos-15-intel
          aarch64-apple-darwin macos-latest
          EOF
          matrix="$(jq -Rnc '
            [ inputs
              | select(length > 0)
              | split(" ")
              | { target: .[0], runner: .[1], archive: "herdr-last-tab-\(.[0]).tar.gz" }
              | . + { sidecar: "\(.archive).sha256" }
            ] | { include: . }
          ' <targets.txt)"
          assets="$(printf '%s' "$matrix" | jq -c '[.include[] | .archive, .sidecar]')"
          {
            echo "matrix=$matrix"
            echo "assets=$assets"
          } >>"$GITHUB_OUTPUT"
          echo "$matrix"
          echo "$assets"

  # The release body comes from CHANGELOG.md. taiki-e/create-gh-release-action parses the Keep a
  # Changelog format and fails when the tag has no section, so a forgotten entry stops the release
  # instead of shipping a bare compare link.
  draft:
    name: Draft release
    needs: [guard]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: taiki-e/create-gh-release-action@eba8ea96c86cca8a37f1b56e94b4d13301fba651 # v1.11.0
        with:
          draft: true
          changelog: CHANGELOG.md
        env:
          GITHUB_TOKEN: ${{ github.token }}

  # One leg per target, each on a runner of that architecture. No cross-compilation and no
  # emulation: a cross-compiled binary that cannot start on its target passes a build matrix and
  # fails the user, so every leg runs the binary it just published.
  #
  # fail-fast stays false deliberately. When one target breaks, seeing whether the other three
  # also broke is the difference between a toolchain problem and a code problem — and publication
  # is gated on all four succeeding regardless, so letting the others finish costs nothing.
  build:
    name: Build ${{ matrix.target }}
    needs: [guard, draft]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.guard.outputs.matrix) }}
    env:
      TAG: ${{ github.ref_name }}
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
      SIDECAR: ${{ matrix.sidecar }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      # rust-toolchain.toml pins the compiler; `rustup show` is what materialises it.
      - name: Install the pinned toolchain
        run: |
          set -euo pipefail
          rustup show
          rustup target add "$TARGET"

      - name: Install musl tooling
        if: contains(matrix.target, 'linux-musl')
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y musl-tools

      # --locked: the release is built from the committed Cargo.lock, never from whatever the
      # registry resolves to today. Without it a release could silently pick up a dependency
      # version nothing in this repository ever built or tested against.
      - name: Build
        run: cargo build --release --locked --target "$TARGET"

      - name: Archive and checksum
        run: |
          set -euo pipefail
          mkdir -p dist
          cp "target/$TARGET/release/herdr-last-tab" dist/herdr-last-tab
          chmod 0755 dist/herdr-last-tab
          tar -czf "$ARCHIVE" -C dist herdr-last-tab
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "$ARCHIVE" >"$SIDECAR"
          elif command -v shasum >/dev/null 2>&1; then
            shasum -a 256 "$ARCHIVE" >"$SIDECAR"
          else
            echo "no sha256 utility on this runner" >&2
            exit 1
          fi
          cat "$SIDECAR"

      - name: Upload to the draft release
        run: gh release upload "$TAG" "$ARCHIVE" "$SIDECAR" --repo "$GITHUB_REPOSITORY" --clobber

      # Sigstore build provenance, tying the archive to this workflow at this commit. Users verify
      # it with the command in docs/RELEASING.md — including --signer-workflow, without which any
      # workflow in this repository would satisfy the check.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: ${{ matrix.archive }}

      # The asset is re-downloaded rather than taken from the working directory, and verified with
      # the same comparison herdr/install.sh performs, because the bytes that matter are the ones
      # GitHub will serve — not the ones this runner happened to produce. Only then is the binary
      # extracted and run, which is what makes FR-020's "exercised on this target" true rather
      # than asserted.
      #
      # This is a liveness check, not an integrity gate: it proves the published binary starts on
      # this architecture. Its integrity value is bounded by the fact that the same job produced
      # the bytes it re-downloads.
      - name: Re-download, verify, and run
        run: |
          set -euo pipefail
          mkdir -p verify
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" \
            --pattern "$ARCHIVE" --pattern "$SIDECAR" --dir verify

          IFS= read -r line <"verify/$SIDECAR" || true
          recorded="$(printf '%s' "${line%% *}" | tr '[:upper:]' '[:lower:]')"
          if command -v sha256sum >/dev/null 2>&1; then
            actual="$(sha256sum "verify/$ARCHIVE" | cut -d' ' -f1)"
          else
            actual="$(shasum -a 256 "verify/$ARCHIVE" | cut -d' ' -f1)"
          fi
          actual="$(printf '%s' "$actual" | tr '[:upper:]' '[:lower:]')"
          if [[ ! $recorded =~ ^[0-9a-f]{64}$ ]]; then
            echo "sidecar $SIDECAR does not start with a sha256 digest" >&2
            exit 1
          fi
          if [ "$recorded" != "$actual" ]; then
            echo "checksum mismatch for the uploaded $ARCHIVE (expected $recorded, got $actual)" >&2
            exit 1
          fi

          mkdir -p verify/extract
          tar -xzf "verify/$ARCHIVE" -C verify/extract --no-same-owner herdr-last-tab

          # contracts/cli.md: no subcommand is exit 2 with the usage message on stderr.
          rc=0
          verify/extract/herdr-last-tab >verify/stdout.txt 2>verify/stderr.txt || rc=$?
          if [ "$rc" -ne 2 ]; then
            echo "expected exit 2 from a bare invocation, got $rc" >&2
            cat verify/stderr.txt >&2
            exit 1
          fi
          grep -qF 'usage: herdr-last-tab <toggle|tab-focused|tab-closed|workspace-closed>' verify/stderr.txt
          echo "$TARGET: verified and exercised"

  # The last gate before the release becomes immutable and installable: the release must carry every
  # asset the guard enumerated before the draft flips, so a published release is never a permanent
  # 404 for the platform whose leg quietly failed to upload.
  #
  # That is asset completeness, and it is deliberately less than FR-020 asks for. FR-020 wants a
  # release to declare only what it exercised, and the strongest evidence for that — actually
  # installing the asset on a host of the target architecture — cannot be gated here, because a
  # draft release exposes no downloadable assets and so there is nothing to install until this job
  # has already run. The install evidence is therefore post-publication and manual, recorded in the
  # release record in docs/RELEASING.md; what this job enforces is that the bytes to install exist.
  # Do not reword this comment into a claim that FR-020 is enforced here.
  publish:
    name: Publish
    needs: [guard, draft, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      ASSETS: ${{ needs.guard.outputs.assets }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Every expected asset is present
        run: |
          set -euo pipefail
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' \
            | LC_ALL=C sort >present.txt
          printf '%s' "$ASSETS" | jq -r '.[]' | LC_ALL=C sort >expected.txt
          missing="$(comm -13 present.txt expected.txt)"
          if [ -n "$missing" ]; then
            echo "the draft is missing release assets:" >&2
            echo "$missing" >&2
            exit 1
          fi
          echo "all $(wc -l <expected.txt | tr -d ' ') expected assets are present"

      - name: Publish the release
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
