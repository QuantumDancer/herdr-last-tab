name: CI

# Branch pushes are covered by the `pull_request` run, since every change reaches `main` through a
# pull request. Leaving `push` unfiltered ran this same single job twice on any branch with a PR
# open — the same four gates, the same commit, twice the minutes — and gave a spurious failure two
# chances to appear: on `525e669` the push run went green through every step while its duplicate
# died in `Set up job` during a GitHub incident, leaving the PR red for a commit that had passed.
# `push` stays for `main` alone, so what actually ships is still gated directly.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # `persist-credentials: false` because every step after this one runs repository-controlled
      # code — `cargo` executes build scripts and test binaries from the tree being checked out,
      # including on a pull request from a fork. The default leaves the job's token in local git
      # configuration where any of that code can read it, and nothing here does a git operation
      # that would need it.
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: rustup show

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test

      # Enumerates the shell scripts that exist rather than globbing paths that may not: a
      # literal `shellcheck herdr/*.sh tests/*.sh` is red at this very checkpoint, since
      # tests/ does not exist until T019 and an unmatched glob is passed through verbatim.
      # `xargs -r` keeps the step green when the enumeration is legitimately empty.
      #
      # `.specify/` is excluded because it is vendored spec-kit tooling, not this project's
      # shell. Its five scripts carry pre-existing SC2155/SC2221/SC2222/SC1091 findings, so
      # an unscoped walk is red on the very commit that adds this gate — the exact failure
      # the enumerate-don't-glob rule above exists to prevent. They are also regenerated by
      # spec-kit, so fixing them here would be reverted rather than kept. `tmp/` is
      # gitignored scratch that never reaches a CI checkout; excluding it makes a local run
      # agree with this step instead of failing on files CI will never see.
      - name: shellcheck
        run: >
          find . -name '*.sh'
          -not -path './target/*'
          -not -path './.specify/*'
          -not -path './tmp/*'
          -print0 | xargs -0 -r shellcheck
